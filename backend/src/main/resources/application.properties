# ==========================================================
# AI ATS RECRUITMENT PLATFORM - APPLICATION CONFIGURATION
# ==========================================================

# Load backend/.env
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]


# ----------------------------------------------------------
# APPLICATION
# ----------------------------------------------------------
spring.application.name=ai-ats-backend

spring.profiles.active=dev


# ----------------------------------------------------------
# SERVER
# ----------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/


# ----------------------------------------------------------
# DATABASE - POSTGRESQL
# ----------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_ats_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver


# ----------------------------------------------------------
# DATABASE CONNECTION POOL
# ----------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ----------------------------------------------------------
# JPA / HIBERNATE
# ----------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


# ----------------------------------------------------------
# MULTIPART FILE UPLOAD
# ----------------------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB


# ----------------------------------------------------------
# FILE STORAGE
# ----------------------------------------------------------
app.storage.upload-dir=${FILE_STORAGE_PATH:./uploads/resumes}
app.storage.issues-dir=${ISSUE_STORAGE_PATH:./uploads/issues}
app.support.email=${REPORT_SUPPORT_EMAIL:${spring.mail.username:support@aiats.com}}



# ----------------------------------------------------------
# JWT AUTHENTICATION
# ----------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ----------------------------------------------------------
# ADMIN SECURITY
# ----------------------------------------------------------
app.admin.registration-code=${ADMIN_REGISTRATION_CODE:ADMIN2026,admin123,admin,123456,change-this-admin-code,edutrack}


# ----------------------------------------------------------
# FRONTEND / CORS
# ----------------------------------------------------------
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:${FRONTEND_URL:http://localhost:5173}}


# ----------------------------------------------------------
# EMAIL - GMAIL SMTP
# ----------------------------------------------------------

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.from=${MAIL_FROM:${spring.mail.username}}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com



# ----------------------------------------------------------
# AI - GEMINI (for TalentPilot Copilot)
# ----------------------------------------------------------
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}


# ----------------------------------------------------------
# LOGGING
# ----------------------------------------------------------
logging.level.com.aiats=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.mail=DEBUG