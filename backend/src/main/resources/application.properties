spring.application.name=ai-ats-backend
spring.profiles.active=dev

# Server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Multipart file upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Storage configuration
app.storage.upload-dir=${FILE_STORAGE_PATH:./uploads/resumes}

# JWT Settings
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
